    <script>
        const str = "ABFCACDB"



function minStr(s){
    
    for (let i = 0, j = 1; i < s.length; i++, j = i + 1) {
        //console.log("outside if",s[i]+s[j])
        
        if(s[i]+s[j] == "AB" || s[i]+s[j] == "CD")
        {
            //console.log(`i value ${i} j value ${j}`)
            let ans = s.slice(0,i) + s.slice(j+1);
            console.log("ans", ans)
            return minStr(ans)
            
        }
        
   
}

console.log(s)

}

minStr(str)
